version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certiflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow_secure_password
      POSTGRES_DB: certiflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow -d certiflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certiflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://certiflow:certiflow_secure_password@postgres:5432/certiflow_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: certiflow_production_super_jwt_secret_key_2026
      PUBLIC_BASE_URL: http://localhost:3000
      QUALITY_REVIEW_THRESHOLD: 50
      STORAGE_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - certificate_storage:/app/uploads

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow_worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://certiflow:certiflow_secure_password@postgres:5432/certiflow_db?schema=public
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: http://localhost:3000
      STORAGE_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - certificate_storage:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certiflow_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  certificate_storage:

